name: ftp deploy

on:
  push:
    branches:
      - source  # Set a branch to deploy
  # Callable by other workflows (mymind-sync), because a push made with
  # GITHUB_TOKEN does not trigger the push event above.
  workflow_call:
    inputs:
      ref:
        description: 'Ref to build and deploy; empty means the triggering commit'
        type: string
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.120.4'
          # extended: true

      - name: Build
        run: hugo --minify

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server:  ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public/
          server-dir: ./sites/zufrieden.io/
          exclude: |
            **/sharing/200*
            **/sharing/201*
            **/sharing/2020*
            **/sharing/2021*
