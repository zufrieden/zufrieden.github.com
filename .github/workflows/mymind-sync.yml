name: mymind sync

on:
  schedule:
    # 05:00 UTC — 07:00 in Zurich during summer time, 06:00 in winter.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be published without writing or tagging'
        type: boolean
        default: false

# Never let two runs publish the same object twice.
concurrency:
  group: mymind-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.sync.outputs.created }}
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false # the tool has no dependencies

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.120.4'

      - name: Publish new mymind shares
        id: sync
        working-directory: tools/mymind-sync
        env:
          MYMIND_KEY_ID: ${{ secrets.MYMIND_KEY_ID }}
          MYMIND_PRIVATE_KEY: ${{ secrets.MYMIND_PRIVATE_KEY }}
        run: go run . -v -repo "$GITHUB_WORKSPACE" ${{ inputs.dry_run && '-dry-run' || '' }}

      # always(): if some objects failed, still commit the ones that succeeded.
      - name: Commit and push
        id: commit
        if: ${{ always() && steps.sync.outputs.created != '' && steps.sync.outputs.created != '0' && !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/sharing
          if git diff --cached --quiet; then
            echo "no new pages to commit"
            exit 0
          fi
          count=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "sharing: publish ${count} item(s) from mymind"
          git push origin HEAD:source
          echo "committed=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger the push-based deploy
  # workflow, so call it directly.
  deploy:
    needs: sync
    if: ${{ always() && needs.sync.outputs.committed == 'true' }}
    uses: ./.github/workflows/ftp.yml
    with:
      ref: source
    secrets: inherit
