		<script>
				// Select all checkboxes on the page
				const checkboxes = document.querySelectorAll('input[type="checkbox"]');
				var activeRound = false;
				var countChecked = 44;
				var allowedClick = new Array();
				var clickedRound = new Array();
				
				function positionExiste(colonne, ligne) {
					// Construct the ID from the provided colonne and ligne
					let elementId = `el_${ligne}_${colonne}`;
					
					// Check if the element with the constructed ID exists
					return document.getElementById(elementId) !== null;
				}
				
				function positionLibre(colonne, ligne) {
					
					if(positionExiste(colonne, ligne)){
						// Construct the ID from the provided colonne and ligne
						let elementId = `el_${ligne}_${colonne}`;
						
						// Check if the element with the constructed ID exists
						// Get the checkbox element by ID
						let checkbox = document.getElementById(elementId);
						
						// Check if the element exists and if it is checked
						return !checkbox.checked;
					}else{
						return false;
					}
				}
				
				document.getElementById('restartgame').addEventListener("click", function (event) {
					activeRound = false;
					clickedRound = [];
					allowedClick = [];
					countChecked = 44;
				});
				
				// Loop through each checkbox and add an event listener
				checkboxes.forEach(checkbox => {
					checkbox.addEventListener("click", function (event) {
						const id = this.id;
						const column = this.getAttribute("data-column");
						const row = this.getAttribute("data-row");
						
						console.log("checkbox checked ? " + this.checked);
						
						if(!activeRound){
							// c'est le premier clique
							
							console.log('Premier clic');
							console.log(id + ' et colone : ' + column + ' et ligne : ' + row);	
							
							
							// vérifier que le pion peut se déplacer
							// J'ai 4 position à vérifier, pour chaque position, est-ce qu'elle existe ? Si oui, est-ce qu'elle est libre ?
							
							// 1ere position : c'est même ligne, mais +2 column
							console.log("check colonne : " + (parseInt(column)+2) +" et ligne :" +row);
							if(positionExiste((parseInt(column)+2), row) && positionLibre((parseInt(column)+2), row)){
								allowedClick.push(`el_${row}_${(parseInt(column)+2)}`);
								console.log(allowedClick);
							}
							
							// 2ième position : c'est même ligne, mais -2 column
							console.log("check colonne : " + (parseInt(column)-2) +" et ligne :" +row);
							if(positionExiste((parseInt(column)-2), row) && positionLibre((parseInt(column)-2), row)){
								allowedClick.push(`el_${row}_${(parseInt(column)-2)}`);
								console.log(allowedClick);
							}
							
							// 3ième position : c'est même clomne, mais +2 lignes
							console.log("check colonne : " + column +" et ligne :" +(parseInt(row)+2));
							if(positionExiste(column, (parseInt(row)+2)) && positionLibre(column, (parseInt(row)+2))){
								allowedClick.push(`el_${(parseInt(row)+2)}_${column}`);
								console.log(allowedClick);
							}							
							
							// 4ième position : c'est même clomne, mais -2 lignes
							console.log("check colonne : " + column +" et ligne :" +(parseInt(row)-2));
							if(positionExiste(column, (parseInt(row)-2)) && positionLibre(column, (parseInt(row)-2))){
								allowedClick.push(`el_${(parseInt(row)-2)}_${column}`);
								console.log(allowedClick);
							}								
							
							// On s'assure que l'on peut jouer
							if (allowedClick.length >= 1) {
								// on peut alors démarrer la manche
								activeRound = true;
								clickedRound['id'] = id;
								clickedRound['row'] = row;
								clickedRound['column'] = column;
								
								// et désactiver tous les checkbox qui ne sont pas permise
								checkboxes.forEach(checkbox => {
									if (!allowedClick.includes(checkbox.id)) {
										checkbox.disabled = true; // Set checkbox to inactive	
									}
								});
								
							}else{
								// si on ne peut pas jouer alors on fait rien
								event.preventDefault();
							}
							
							
						}else{
							// c'est le deuxième
							console.log('Deuxième clic');
							
							// test si c'est sur le allowClick ? 
							if(allowedClick.includes(checkbox.id)){
								
								// enlever la checkbox entre les 2
								console.log("id : " + clickedRound['id']);
								console.log("row : " + clickedRound['row']);
								console.log("column : " + clickedRound['column']);
								console.log('compared with');
								console.log("id : " + id);
								console.log("row : " + row);
								console.log("column : " + column);
								
								// Si c'est la même colonne 
									if(clickedRound['column'] == column){
										// on compare la ligne
										if(clickedRound['row'] > row){
										// si elle est plus petite, on fait ligne mois un 
											console.log(`change : el_${parseInt(row)+1}_${column}`);
											document.getElementById(`el_${parseInt(row)+1}_${column}`).checked = false;
										// sinon plus un 
										}else{
											console.log(`change : el_${parseInt(row)-1}_${column}`);
											document.getElementById(`el_${parseInt(row)-1}_${column}`).checked = false;
										}		
									}
								// Si c'est la même ligne
									// on compare la colonne
									if(clickedRound['row'] == row){
										// on compare la ligne
										if(clickedRound['column'] > column){
										// si elle est plus petite, on fait colonne mois un 
											console.log(`change : el_${row}_${parseInt(column)+1}`);
											document.getElementById(`el_${row}_${parseInt(column)+1}`).checked = false;
										// sinon plus un 
										}else{
											console.log(`change : el_${row}_${parseInt(column)-1}`);
											document.getElementById(`el_${row}_${parseInt(column)-1}`).checked = false;
										}		
									}
								
								// si oui alors il faut reset le tour
								activeRound = false;
								clickedRound = [];
								allowedClick = [];
								countChecked = parseInt(countChecked) - 1;
								document.getElementById('scoreboard').value = countChecked;
								
								
								// et désactiver tous les checkbox qui ne sont pas permise
								checkboxes.forEach(checkbox => {
									checkbox.disabled = false; // Set checkbox to active again
								});
								
							}
							
						}
						
						
					});
				});
